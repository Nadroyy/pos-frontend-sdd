AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  pos-serverless-sdd
  Arquitectura serverless para el sistema POS - Supermarket Point of Sale

# ── Globals para funciones Lambda Java ───────────────────────────────────
Globals:
  Function:
    Runtime: java21
    Timeout: 30
    MemorySize: 512

# ── Recursos ──────────────────────────────────────────────────────────────
Resources:

  # ── API Gateway ──────────────────────────────────────────────────────────
  PosApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: pos-serverless-api
      StageName: prod
      Description: API REST del sistema POS Supermercado
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # ── Lambda: Productos ─────────────────────────────────────────────────────
  ProductosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pos-productos
      Description: GET /productos - Lista y busca productos desde DynamoDB
      CodeUri: productos-function/
      Handler: com.pos.productos.ProductosHandler::handleRequest
      Environment:
        Variables:
          PRODUCT_TABLE_NAME: !Ref ProductosTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProductosTable
      Events:
        GetProductos:
          Type: Api
          Properties:
            RestApiId: !Ref PosApi
            Path: /productos
            Method: GET

  # ── Lambda: Ventas ────────────────────────────────────────────────────────
  VentasFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: pos-ventas
      Description: POST /ventas - Registra una venta en DynamoDB
      CodeUri: ventas-function/
      Handler: com.pos.ventas.VentasHandler::handleRequest
      Environment:
        Variables:
          SALES_TABLE_NAME: !Ref VentasTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref VentasTable
      Events:
        PostVentas:
          Type: Api
          Properties:
            RestApiId: !Ref PosApi
            Path: /ventas
            Method: POST

  # ── DynamoDB: Tabla Productos ─────────────────────────────────────────────
  ProductosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "productos-table-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: productId
          AttributeType: S
      KeySchema:
        - AttributeName: productId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: pos-serverless-sdd
        - Key: Environment
          Value: prod

  # ── DynamoDB: Tabla Ventas ────────────────────────────────────────────────
  VentasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "ventas-table-${AWS::StackName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: saleId
          AttributeType: S
      KeySchema:
        - AttributeName: saleId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: pos-serverless-sdd
        - Key: Environment
          Value: prod

# ── Outputs ───────────────────────────────────────────────────────────────
Outputs:

  ApiUrl:
    Description: URL base de la API Gateway
    Value: !Sub "https://${PosApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
    Export:
      Name: !Sub "${AWS::StackName}-ApiUrl"

  ProductosFunctionArn:
    Description: ARN de la Lambda de productos
    Value: !GetAtt ProductosFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ProductosFunctionArn"

  VentasFunctionArn:
    Description: ARN de la Lambda de ventas
    Value: !GetAtt VentasFunction.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VentasFunctionArn"

  ProductosTableName:
    Description: Nombre de la tabla DynamoDB de productos
    Value: !Ref ProductosTable
    Export:
      Name: !Sub "${AWS::StackName}-ProductosTableName"

  VentasTableName:
    Description: Nombre de la tabla DynamoDB de ventas
    Value: !Ref VentasTable
    Export:
      Name: !Sub "${AWS::StackName}-VentasTableName"
